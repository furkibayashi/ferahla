<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Ferahla</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <!-- Sıra önemli: mock-api yalnızca window.ferahla yoksa devreye girer; sonra metinler, ikonlar, treemap, uygulama. -->
  <script src="mock-api.js"></script>
  <script src="i18n.js" defer></script>
  <script src="icons.js" defer></script>
  <script src="treemap.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link" id="skip-link" href="#main">İçeriğe geç</a>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="logo.svg" alt="" width="36" height="36">
        <div class="brand-text">
          <div class="brand-name">Ferahla</div>
          <div class="brand-tag" id="brand-tag"></div>
        </div>
      </div>
      <nav id="nav" aria-label="Bölümler">
        <ul class="nav-list" id="nav-list"></ul>
      </nav>
      <div class="sidebar-foot">
        <p class="privacy" id="privacy-note"></p>
      </div>
    </aside>

    <main class="main" id="main" tabindex="-1">
      <div id="view"></div>
    </main>
  </div>

  <div class="tip" id="tip" role="tooltip" hidden></div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <p class="sr-only" id="sr-status" role="status" aria-live="polite"></p>

  <dialog class="dlg" id="dlg" aria-labelledby="dlg-title" aria-describedby="dlg-body">
    <form method="dialog">
      <div class="dlg-inner">
        <h2 id="dlg-title"></h2>
        <div class="dlg-body" id="dlg-body"></div>
      </div>
      <div class="dlg-actions">
        <button type="submit" class="btn btn-secondary" value="cancel" id="dlg-cancel"></button>
        <button type="submit" class="btn btn-primary" value="ok" id="dlg-ok"></button>
      </div>
    </form>
  </dialog>
</body>
</html>
